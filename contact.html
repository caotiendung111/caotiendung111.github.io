<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ | Cao Tiến Dũng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="section container">
      <h2 class="section-title">Trò chuyện cùng tôi</h2>
      <p class="section-subtitle">Bạn đang tìm kiếm một kỹ sư tài năng cho dự án AI/Nhúng tiếp theo? Hãy kết nối ngay!</p>

      <div class="contact-form">
        <form action="https://formsubmit.co/tiendung04dtvt@gmail.com" method="POST">
          <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Họ và tên</label>
            <input type="text" name="name" class="form-control" required placeholder="Nhập tên của bạn...">
          </div>
          <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Email liên hệ</label>
            <input type="email" name="email" class="form-control" required placeholder="email@domain.com">
          </div>
          <div class="form-group">
            <label style="display:block; margin-bottom: 5px; font-weight: 500;">Lời nhắn</label>
            <textarea name="message" class="form-control" required placeholder="Bạn muốn thảo luận về vấn đề gì?"></textarea>
          </div>
          <input type="hidden" name="_subject" value="New submission from Portfolio">
          <input type="hidden" name="_captcha" value="false">
          
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            <i class="fas fa-paper-plane"></i> Gửi tin nhắn
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; color: var(--text-muted);">
          <p><i class="fas fa-phone-alt"></i> 0886 284 526 &nbsp;&nbsp;|&nbsp;&nbsp; <i class="fas fa-envelope"></i> tiendung04dtvt@gmail.com</p>
        </div>

        <div class="social-links">
          <a href="https://github.com/caotiendung111" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
          <a href="https://linkedin.com/in/tiendung-dut" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="mailto:tiendung04dtvt@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
        </div>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cao Tien Dung. Crafted with passion.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
