<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Cao Tien Dung (Harry)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="section container">
      <h2 class="section-title">Get in Touch</h2>
      <p class="section-subtitle">
        Interested in collaborating on Embedded AI, STEM evaluation projects, or hiring for technical engineering roles? Feel free to reach out.
      </p>

      <div class="contact-form">
        <form action="https://formsubmit.co/tiendung04dtvt@gmail.com" method="POST">
          <div class="form-group">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem;">Full Name</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. John Doe">
          </div>
          <div class="form-group">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem;">Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="your.email@company.com">
          </div>
          <div class="form-group">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem;">Subject</label>
            <input type="text" name="_subject" class="form-control" required placeholder="Project Inquiry / Job Opportunity">
          </div>
          <div class="form-group">
            <label style="display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem;">Message</label>
            <textarea name="message" class="form-control" required placeholder="Describe your inquiry, project scope, or opportunity..."></textarea>
          </div>
          
          <input type="hidden" name="_captcha" value="false">
          
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1rem;">
            <i class="fas fa-paper-plane"></i> Send Message
          </button>
        </form>

        <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.95rem; line-height: 1.8;">
          <p><i class="fas fa-map-marker-alt" style="color: var(--primary);"></i> Da Nang, Vietnam</p>
          <p><i class="fas fa-phone-alt" style="color: var(--primary);"></i> (+84) 0886 284 526</p>
          <p><i class="fas fa-envelope" style="color: var(--primary);"></i> tiendung04dtvt@gmail.com</p>
        </div>

        <div class="social-links" style="margin-top: 20px;">
          <a href="https://github.com/caotiendung111" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
          <a href="https://linkedin.com/in/tiendung-dut" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://www.facebook.com/kDoonJ" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="mailto:tiendung04dtvt@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
          <a href="tel:0886284526" title="Call"><i class="fas fa-phone-alt"></i></a>
        </div>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cao Tien Dung (Harry). Designed & Developed with Engineering Precision.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
